name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and verify app
        env:
          NEKO_DEVELOPMENT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/build.sh
      - name: Existing offline regression tests
        run: ./scripts/test-all.sh
      - name: Package CI build
        run: PACKAGE_EXISTING_BUILD=1 ./scripts/package-release.sh
      - name: Upload development installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-development-installer
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Upload native macOS cat captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-cat-native-renders
          path: |
            build/cat-render/
            build/appearance/*.png
            build/clipboard-picker-*.png
          if-no-files-found: warn

  free-release-check:
    # Never expose publisher credentials to PR/fork code. This job only runs
    # after a trusted push to main or this implementation branch and publishes
    # no release/tag/feed. The PR job above remains entirely secret-free.
    if: github.event_name == 'push' && github.repository == 'yuipan0611/whats-up-my-neighbor-ai-input-macos' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/neko-cicd-updates')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate free release without any Apple paid credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_SHA1: ${{ vars.MACOS_SIGNING_SHA1 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          export RELEASE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          export RELEASE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"
          ./scripts/release-macos.sh
