name: Office regression tests

on:
  push:
    paths:
      - 'office/**'
      - '.github/workflows/office-tests.yml'
  pull_request:
    paths:
      - 'office/**'
      - '.github/workflows/office-tests.yml'

permissions:
  contents: read

concurrency:
  group: office-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        tracing: [disabled, enabled]
    env:
      NEKO_TRACE_ENABLED: '0'
      OTEL_TRACES_SAMPLER: always_on
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/office-python"
      - name: Install optional tracing dependencies
        if: matrix.tracing == 'enabled'
        run: |
          "$RUNNER_TEMP/office-python/bin/python" -m pip install --require-hashes -r office/requirements-observability.txt
          "$RUNNER_TEMP/office-python/bin/python" -I -c 'import opentelemetry.sdk.trace, opentelemetry.exporter.otlp.proto.http.trace_exporter, openinference.semconv.trace'
      - name: Test office and tracing integration
        run: '"$RUNNER_TEMP/office-python/bin/python" -I -m unittest discover -s office/tests -v'
