<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NekoChat Windows Lite — 互動預覽</title>
  <style>
    body{font:16px system-ui;background:#e9e5df;margin:48px;color:#292828}
    main{display:flex;gap:60px;align-items:center;max-width:900px}
    .pet{width:280px;flex-shrink:0;text-align:center}
    .bubble{display:block;width:100%;box-sizing:border-box;background:white;color:#292828;border-radius:18px;padding:18px;box-shadow:0 4px 20px #0001;text-align:left;cursor:pointer}
    .bubble[hidden]{display:none}
    .bubble-message{display:block;white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow-y:auto;margin:8px 0}
    svg{display:block;width:210px;height:210px;margin:12px auto 0}
    .window{width:390px;max-width:100%;box-sizing:border-box;background:#faf9f7;padding:24px;border-radius:12px;box-shadow:0 10px 40px #0002}
    label{display:block;margin-top:16px}
    input,textarea{box-sizing:border-box;width:100%;margin:8px 0;padding:10px;border:1px solid #ccc;border-radius:6px;font:inherit}
    button{padding:10px 16px;border:0;border-radius:6px;background:#292828;color:white;margin:4px 4px 4px 0;font:inherit;cursor:pointer}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #886a77;outline-offset:3px}
    button:disabled{background:#ddd;color:#666;cursor:default}
    small,.note{color:#666;font-size:13px;line-height:1.6}
    #status{min-height:2.5em;font-size:14px;line-height:1.6}
    #empty-note{font-size:14px;line-height:1.6}
    @media(max-width:740px){body{margin:24px}main{flex-direction:column;gap:24px}.pet{width:min(280px,100%)}.window{width:100%}}
  </style>
</head>
<body>
  <h1>NekoChat · Windows Lite</h1>
  <p>本機互動預覽：輸入訊息並按「傳送（預覽）」，文字就會出現在貓咪頭頂。</p>
  <p class="note">此頁不會傳訊給好友，也沒有連接 LAN、VPS 或麥克風。實際聊天需要 Windows 程式與 Relay。</p>
  <main>
    <div class="pet">
      <p id="empty-note">等待訊息…<br>送出預覽後，氣泡會出現在這裡。</p>
      <button id="message-bubble" class="bubble" type="button" hidden aria-label="訊息氣泡，點擊回覆">
        <small id="bubble-recipient"></small>
        <span id="bubble-message" class="bubble-message"></span>
        <small>點擊氣泡，回到回覆欄</small>
      </button>
      <svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="YUI Neko / C Mascot">
<path id="Vector" d="M282 258C335 213 383 231 373 274C365 313 333 335 286 326L272 301C315 315 347 296 348 269C348 250 322 250 293 276L282 258Z" fill="#101114"/>
<path id="Vector_2" d="M152 203C114 205 86 243 77 289C66 338 92 365 149 366H254C312 365 333 338 323 290C314 245 285 205 247 203H152Z" fill="#101114"/>
<path id="Vector_3" d="M148 283C138 312 138 334 148 360M253 283C264 312 264 334 254 360" stroke-width="2" stroke="#303034"/>

<path id="Vector_7" d="M100 147L114 161M114 161L128 175M114 161L128 147M114 161L100 175" stroke-width="13" stroke-linecap="round" stroke="white"/>
<path id="Vector_8" d="M267 162L279 174L306 145" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke="white"/>
<path id="Vector_9" d="M183 187C184 199 197 199 201 187C204 199 218 199 219 187" stroke-width="7" stroke-linecap="round" stroke="white"/>
</g>
</svg>
    </div>
    <section class="window" aria-labelledby="chat-title">
      <h2 id="chat-title">NekoChat</h2>
      <small>本機互動預覽 · 尚未連線</small>
      <form id="composer" novalidate>
        <label for="recipient">好友 ID（示範）</label>
        <input id="recipient" value="xiaoyu" autocomplete="off" maxlength="32">
        <label for="draft">訊息</label>
        <textarea id="draft" rows="4" placeholder="輸入想在氣泡顯示的文字…" aria-describedby="character-count status"></textarea>
        <small id="character-count">0 / 2000 字</small>
        <div>
          <button type="button" disabled title="瀏覽器預覽未接入錄音">🎙 語音草稿</button>
          <button type="submit">傳送（預覽）</button>
        </div>
        <button id="reset-preview" type="button">清除預覽</button>
        <p id="status" role="status" aria-live="polite">輸入訊息後按傳送；也可以按 Ctrl／⌘ + Enter。</p>
      </form>
      <hr>
      <small>Windows 程式的全系統語音輸入：Ctrl + Alt + Space。<br>本頁只示範訊息氣泡與回覆互動。</small>
    </section>
  </main>
  <script>
    'use strict';
    const composer = document.getElementById('composer');
    const draft = document.getElementById('draft');
    const recipient = document.getElementById('recipient');
    const bubble = document.getElementById('message-bubble');
    const bubbleMessage = document.getElementById('bubble-message');
    const bubbleRecipient = document.getElementById('bubble-recipient');
    const emptyNote = document.getElementById('empty-note');
    const status = document.getElementById('status');
    const count = document.getElementById('character-count');
    let displayedRecipient = '';

    draft.addEventListener('input', () => {
      count.textContent = `${Array.from(draft.value).length} / 2000 字`;
    });
    composer.addEventListener('submit', event => {
      event.preventDefault();
      const text = draft.value;
      if (!text.trim()) {
        status.textContent = '請先輸入訊息，再按傳送。';
        draft.focus();
        return;
      }
      if (Array.from(text).length > 2000) {
        status.textContent = '訊息最多 2000 字，請縮短後再傳送。';
        draft.focus();
        return;
      }
      displayedRecipient = recipient.value.trim() || '好友';
      bubbleRecipient.textContent = `我 → ${displayedRecipient}（本機預覽）`;
      bubbleMessage.textContent = text;
      bubble.hidden = false;
      emptyNote.hidden = true;
      status.textContent = '氣泡已在貓咪頭頂顯示。這是本機預覽，沒有傳送到其他電腦。';
    });
    draft.addEventListener('keydown', event => {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && !event.isComposing) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });
    bubble.addEventListener('click', () => {
      recipient.value = displayedRecipient;
      draft.focus();
      draft.select();
      status.textContent = `正在回覆 ${displayedRecipient}，修改文字後再按傳送（預覽）。`;
    });
    document.getElementById('reset-preview').addEventListener('click', () => {
      draft.value = '';
      count.textContent = '0 / 2000 字';
      bubbleMessage.textContent = '';
      bubble.hidden = true;
      emptyNote.hidden = false;
      status.textContent = '已清除預覽，請輸入新的訊息。';
      draft.focus();
    });
  </script>
</body>
</html>
