</svg><h1>NekoChat<br><small>一鍵安裝與教室配對 · 流程預覽</small></h1></header><p class="note">這是操作流程示範。沒有連線、沒有安裝程式，也不會儲存金鑰；請勿在預覽輸入真實 API Key。</p><div class="steps"><section class="card"><h2>1. 安裝後直接開啟</h2><p>同學下載同一個安裝檔。</p><button id="install">安裝並啟動</button><p id="installed" class="status">安裝到目前使用者的資料夾，建立開始功能表捷徑。內含執行所需元件。</p><label>自己的 Groq Key</label><input disabled placeholder="在 Windows App 內填寫，預覽不收集金鑰"><small>只存在這台電腦的 Windows 認證管理員。聊天文字不需要 Groq Key。</small></section><section class="card"><h2>2. 與同學連線</h2><p>一台建立房間，另一台加入。</p><button id="host">建立房間</button><div id="hosted" class="hidden"><label>給同學的邀請碼</label><textarea readonly rows="2">DEMO-邀請碼只供此流程展示</textarea><small>私下分享給要互傳訊息的同學。房主離開後失效。</small></div><label for="invite">同學給你的邀請碼</label><textarea id="invite" rows="2" placeholder="貼上邀請碼"></textarea><button id="join">加入房間</button><button id="leave" class="secondary">離開房間</button><p id="room-status" class="status" role="status">未加入房間；可以先用語音輸入。</p></section></div><p class="note">進入房間後，收件人自動設為已配對的同學。語音傳訊先形成草稿，確認後再傳送。學校網路必須允許兩台電腦互連。</p></main><script>const room=document.getElementById('room-status');document.getElementById('install').onclick=()=>document.getElementById('installed').textContent='示範：安裝完成並開啟 NekoChat。Windows 同學不需要另外安裝 Python 或 .NET。';document.getElementById('host').onclick=()=>{document.getElementById('hosted').classList.remove('hidden');room.textContent='示範：房間已建立，把邀請碼私下給同學，等待對方加入。';};document.getElementById('join').onclick=()=>{room.textContent=document.getElementById('invite').value.trim()?'示範：已與同學配對，收件人已自動設定，可以互傳訊息。':'請先貼上同學給你的邀請碼。';};document.getElementById('leave').onclick=()=>{document.getElementById('hosted').classList.add('hidden');room.textContent='示範：已離開房間，本機語音輸入仍可使用。';};</script></html>
